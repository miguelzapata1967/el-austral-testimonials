<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>il_Decimus · El Austral Consultant · Prototype</title>
<meta name="description" content="il_Decimus prototype: free data clean-up trial. Choose your language / Elegí tu idioma.">

<link rel="icon" type="image/png" sizes="32x32" href="en/favicon-32.png">
<link rel="apple-touch-icon" href="en/apple-touch-icon.png">
<meta name="theme-color" content="#16294D">

<!-- Link preview (WhatsApp, Facebook, LinkedIn, email...) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.elaustralconsultant.com/il_decimus/">
<meta property="og:title" content="il_Decimus · El Austral Consultant · Prototype">
<meta property="og:description" content="Free data clean-up trial · Prueba gratis de limpieza de datos. English / Español.">
<meta property="og:image" content="https://www.elaustralconsultant.com/il_decimus/en/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">

<script>
  // Someone who installed the OLD il_Decimus icon lands here with ?app=1: send them straight into the tool
  if (new URLSearchParams(location.search).get("app") === "1") location.replace("https://el-austral-demo.streamlit.app");
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:linear-gradient(180deg,#0f1f3f 0%,#16294D 55%,#0b1630 100%); color:#eef2f8;
         font-family:"Helvetica Neue",Arial,sans-serif; text-align:center; padding:24px; box-sizing:border-box; }
  .label { color:#C9A227; letter-spacing:.3em; font-size:.8rem; font-weight:700; margin-bottom:6px; }
  h1 { margin:0 0 6px; font-size:2.2rem; }
  .tag { display:inline-block; background:#B3243A; color:#fff; border-radius:999px; padding:4px 14px;
         font-size:.85rem; font-weight:700; letter-spacing:.05em; margin-bottom:18px; }
  p  { color:#c4cee0; margin:4px 0 22px; }
  .choices { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
  /* One card per language: icon + language name */
  a.lang { display:flex; flex-direction:column; align-items:center; gap:12px; width:210px; padding:22px 16px;
           border:2px solid rgba(255,255,255,.35); border-radius:18px; color:#fff; text-decoration:none;
           background:rgba(255,255,255,.05); transition:transform .15s, border-color .15s, background .15s; }
  a.lang:hover, a.lang:focus { transform:translateY(-3px); border-color:#fff; background:rgba(255,255,255,.1); }
  a.lang.suggested { border-color:#C9A227; }       /* matches the visitor's browser language */
  a.lang img { width:140px; height:140px; border-radius:28px; box-shadow:0 6px 22px rgba(0,0,0,.45); }
  a.lang .name { font-size:1.25rem; font-weight:700; }
  a.lang .sub { font-size:.85rem; color:#c4cee0; }
  footer { margin-top:30px; font-size:.8rem; color:#8f9bb3; }
</style>
</head>
<body>
  <div class="label">EL AUSTRAL CONSULTANT</div>
  <h1>il_Decimus</h1>
  <div class="tag">PROTOTYPE · PROTOTIPO</div>
  <p>Choose your language &nbsp;·&nbsp; Elegí tu idioma</p>

  <div class="choices">
    <a class="lang" id="pick-en" href="en/">
      <img src="en/icon-512.png" alt="il_Decimus English icon">
      <span class="name">English</span>
      <span class="sub">Free · 10 clean-ups</span>
    </a>
    <a class="lang" id="pick-es" href="es/">
      <img src="es/icon-512.png" alt="Ícono de il_Decimus en español">
      <span class="name">Español</span>
      <span class="sub">Gratis · 10 limpiezas</span>
    </a>
  </div>

  <footer>El Austral Consultant · El Austral Consultor · San Jose, CA</footer>

<script>
  // Highlight the language the visitor's browser uses (they still choose)
  const es = (navigator.language || "").toLowerCase().startsWith("es");
  document.getElementById(es ? "pick-es" : "pick-en").classList.add("suggested");
</script>
</body>
</html>
